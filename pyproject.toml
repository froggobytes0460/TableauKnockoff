[project]
name = "tableauknockoff"
version = "0.1.0"
description = "A FastAPI application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.109.0",
    "fastui>=0.9.0",
    "langchain-groq>=1.1.2",
    "langgraph>=1.1.6",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "prettytable>=3.17.0",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.14.0",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.26.0",
    "black>=26.3.1",
    "langgraph-cli>=0.4.22",
    "langgraph-cli[inmem]>=0.4.22",
]

[tool.uv]
default-groups = []

[tool.hatch.build.targets.wheel]
packages = ["agent", "database", "web", "config"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
